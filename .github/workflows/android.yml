name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 8.2.0
        uses: actions/setup-java@v4
        with:
          java-version: '8.2.0'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x RavanRAT/gradlew

      - name: Build with Gradle
        run: cd RavanRAT && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: RavanRAT/app/build/outputs/apk/debug/app-debug.apk
